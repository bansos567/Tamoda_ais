name: Build Tamoda Extension

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Set up JDK 8
      uses: actions/setup-java@v3
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Install Ant
      run: sudo apt-get install ant

    - name: Run Upgrade Script
      run: |
        chmod +x upgrade-appinventor.sh
        ./upgrade-appinventor.sh

    - name: Compile Extension (Ant)
      run: ant extensions

    - name: Simpan Hasil AIX
      uses: actions/upload-artifact@v3
      with:
        name: TamodaLauncher-Build
        path: out/*.aix
