name: Build Tamoda Extension

on:
  push:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4 # <-- Diupdate ke v4
      with:
        submodules: 'recursive'

    - name: Set up JDK 8
      uses: actions/setup-java@v4 # <-- Diupdate ke v4
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Build Extension with Ant
      run: ant

    - name: Upload AIX File
      uses: actions/upload-artifact@v4 # <-- INI SOLUSI ERRORNYA, Diupdate ke v4
      with:
        name: TamodaLauncher-Extension
        path: out/*.aix
